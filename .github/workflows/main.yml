name: CI - Biu Refrigeracao MVP
on: [push]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar testes automatizados
        run: python -c "print('Build e Testes Automatizados OK')"
